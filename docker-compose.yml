version: '3.8'

services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres_db;Database=myapp;Username=postgres;Password=yourpassword
      - ConnectionStrings__Redis=redis_cache:6379
    depends_on:
      postgres_db:
        condition: service_healthy # Wait until Postgres is fully booted, not just starting
      redis_cache:
        condition: service_started

  postgres_db:
    image: postgres:latest
    container_name: postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourpassword
      - POSTGRES_DB=myapp
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck: # Ensures webapi doesn't hit it too early
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:latest
    container_name: redis_cache
    command: redis-server --appendonly yes # Forces Redis to save changes to disk instantly
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data # Persists the Redis data across restarts

volumes:
  postgres-data:
  redis-data: # New volume for Redis
